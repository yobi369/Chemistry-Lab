name: Quality checks

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run tests
        run: bun run test
      - name: Verify vendored Qin–Tratnyek 2018 experimental data checksum
        id: qin_data
        run: |
          mkdir -p /tmp/qin-2018
          cp data/experimental/qin-2018/QinTratnyek18-H2vsTime-Data.csv /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv
          echo "31d726a893ac0e803e6471f5927d875e  /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv" | md5sum --check
      - name: Archive exact checksum-verified Qin source CSV
        if: steps.qin_data.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qin-2018-source-csv
          path: /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv
          retention-days: 30
      - name: Parse and audit the real Qin experimental time series
        if: steps.qin_data.outcome == 'success'
        run: bun run scripts/benchmarks/verify_qin_2018_dataset.ts /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv
      - name: Fit Qin Models 4L and 4G against candidate paper observation set
        if: steps.qin_data.outcome == 'success'
        run: bun run scripts/benchmarks/fit_qin_2018_dataset.ts /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv > /tmp/qin-model4-typescript.json
      - name: Audit alternative Qin Model 4 observation-selection conventions
        if: steps.qin_data.outcome == 'success'
        run: bun run scripts/benchmarks/audit_qin_2018_model4_observation_selection.ts /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv > /tmp/qin-model4-selection-audit.json
      - name: Archive Qin Model 4 observation-selection audit
        if: steps.qin_data.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qin-model4-observation-selection-audit
          path: /tmp/qin-model4-selection-audit.json
          retention-days: 30
      - name: Fit Qin Models 1 to 3 against original experimental series
        if: steps.qin_data.outcome == 'success'
        run: bun run scripts/benchmarks/fit_qin_2018_models_1_to_3.ts /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv > /tmp/qin-models123-typescript.json
      - name: Run deterministic Qin Model 4 stratified cluster bootstrap
        if: steps.qin_data.outcome == 'success'
        run: bun run scripts/benchmarks/bootstrap_qin_2018_model4.ts /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv 20 20261103 > /tmp/qin-model4-bootstrap.json
      - name: Archive Qin Model 4 bootstrap intervals
        if: steps.qin_data.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qin-model4-cluster-bootstrap
          path: /tmp/qin-model4-bootstrap.json
          retention-days: 30
      - name: Run 500-replicate Qin Model 4 bootstrap with three independent seeds
        if: steps.qin_data.outcome == 'success'
        run: bun run scripts/benchmarks/bootstrap_qin_2018_model4_multiseed.ts /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv 500 20261103,20261104,20261105 > /tmp/qin-model4-bootstrap-multiseed.json
      - name: Archive Qin Model 4 multi-seed bootstrap stability report
        if: steps.qin_data.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qin-model4-multiseed-bootstrap
          path: /tmp/qin-model4-bootstrap-multiseed.json
          retention-days: 30
      - name: Run Qin Model 4 conditional profile-likelihood diagnostics
        if: steps.qin_data.outcome == 'success'
        run: bun run scripts/benchmarks/profile_qin_2018_model4.ts /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv 81 > /tmp/qin-model4-profiles.json
      - name: Archive Qin Model 4 profile-likelihood curves
        if: steps.qin_data.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qin-model4-profile-likelihood
          path: /tmp/qin-model4-profiles.json
          retention-days: 30
      - name: Verify independent SciPy reference benchmarks
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned benchmark dependency
        run: python -m pip install -r requirements-benchmarks.txt
      - name: Independently verify Qin Model 4 profile likelihood with SciPy
        if: steps.qin_data.outcome == 'success'
        run: python scripts/benchmarks/verify_qin_model4_profile_scipy.py /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv /tmp/qin-model4-profiles.json > /tmp/qin-model4-profile-scipy.json
      - name: Archive independent SciPy profile-likelihood comparison
        if: steps.qin_data.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qin-model4-profile-scipy-validation
          path: /tmp/qin-model4-profile-scipy.json
          retention-days: 30
      - name: Verify stiff sequential kinetic fitting against independent SciPy BDF
        run: python scripts/benchmarks/verify_scipy_stiff_kinetic_fit.py > /tmp/stiff-kinetic-fit-scipy.json
      - name: Archive independent SciPy stiff-fit reference
        uses: actions/upload-artifact@v4
        with:
          name: stiff-kinetic-fit-scipy-reference
          path: /tmp/stiff-kinetic-fit-scipy.json
          retention-days: 30
      - name: Verify stiff reversible slow-drain network against independent SciPy BDF and Radau
        run: python scripts/benchmarks/verify_scipy_stiff_reversible_slow_drain.py > /tmp/stiff-reversible-slow-drain-scipy.json
      - name: Archive independent SciPy stiff-network fit reference
        uses: actions/upload-artifact@v4
        with:
          name: stiff-reversible-slow-drain-scipy-reference
          path: /tmp/stiff-reversible-slow-drain-scipy.json
          retention-days: 30
      - name: Verify 2-D diffusion mesh convergence against independent SciPy BDF and Radau
        run: python scripts/benchmarks/verify_spatial2d_mesh_convergence.py > /tmp/spatial2d-mesh-convergence.json
      - name: Archive independent 2-D diffusion mesh convergence report
        uses: actions/upload-artifact@v4
        with:
          name: spatial2d-scipy-mesh-convergence
          path: /tmp/spatial2d-mesh-convergence.json
          retention-days: 30
      - name: Reproduce independent BDF and Radau reference fixtures
        run: python scripts/benchmarks/verify_scipy_references.py
      - name: Verify independent nonlinear kinetic fitting benchmark
        run: python scripts/benchmarks/verify_scipy_kinetic_fit.py
      - name: Independently verify Qin Model 4 global fits and complete predictions with SciPy
        if: steps.qin_data.outcome == 'success'
        run: python scripts/benchmarks/verify_qin_global_fits_scipy.py /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv /tmp/qin-model4-typescript.json > /tmp/qin-model4-prediction-validation.json
      - name: Archive complete Qin Model 4 prediction/residual comparison
        if: steps.qin_data.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qin-model4-prediction-validation
          path: /tmp/qin-model4-prediction-validation.json
          retention-days: 30
      - name: Independently verify Qin Models 1 to 3 with SciPy
        if: steps.qin_data.outcome == 'success'
        run: python scripts/benchmarks/verify_qin_models_1_to_3_scipy.py /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv /tmp/qin-models123-typescript.json
      - name: Install pinned RDKit.js runtime for molecular smoke tests and local browser assets
        run: npm install --no-save --package-lock=false @rdkit/rdkit@2026.9.1 playwright@1.56.1
      - name: Build application with same-origin RDKit assets
        run: bun run build
      - name: Verify locally staged RDKit JavaScript and WebAssembly assets
        run: node scripts/benchmarks/verify_rdkit_local_assets.mjs
      - name: Install Chromium for deployed-runtime browser validation
        run: npx playwright install --with-deps chromium
      - name: Verify RDKit in Chromium with CSP and offline cache enabled
        run: node scripts/benchmarks/verify_rdkit_browser.mjs
      - name: Verify RDKit canonical identity, stereochemistry, InChI and valence
        run: node scripts/benchmarks/verify_rdkit_runtime.mjs
