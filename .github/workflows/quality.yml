name: Quality checks

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run tests
        run: bun run test
      - name: Download and verify published Qin–Tratnyek 2018 experimental data
        run: |
          mkdir -p /tmp/qin-2018
          curl --fail --location --retry 3 --retry-all-errors \
            "https://zenodo.org/records/1979080/files/QinTratnyek18-H2vsTime-Data.csv?download=1" \
            --output /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv
          echo "31d726a893ac0e803e6471f5927d875e  /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv" | md5sum --check
      - name: Parse and audit the real Qin experimental time series
        run: bun run scripts/benchmarks/verify_qin_2018_dataset.ts /tmp/qin-2018/QinTratnyek18-H2vsTime-Data.csv
      - name: Verify independent SciPy reference benchmarks
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned benchmark dependency
        run: python -m pip install -r requirements-benchmarks.txt
      - name: Reproduce independent BDF and Radau reference fixtures
        run: python scripts/benchmarks/verify_scipy_references.py
      - name: Verify independent nonlinear kinetic fitting benchmark
        run: python scripts/benchmarks/verify_scipy_kinetic_fit.py
      - name: Build application
        run: bun run build
      - name: Install pinned RDKit.js runtime for molecular smoke tests
        run: npm install --no-save --package-lock=false @rdkit/rdkit@2026.9.1
      - name: Verify RDKit canonical identity, stereochemistry, InChI and valence
        run: node scripts/benchmarks/verify_rdkit_runtime.mjs
